# Render Blueprint — one-click API + Postgres for AI Workspace
# https://render.com/docs/blueprint-spec
# Deploy: connect this repo in Render → New → Blueprint

services:
  - type: web
    name: ai-workspace-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_API_DOCS
        value: "true"
      - key: LLM_PROVIDER
        value: openai
      - key: DATABASE_URL
        fromDatabase:
          name: ai-workspace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://([\w-]+\.)?vercel\.app

databases:
  - name: ai-workspace-db
    plan: free
