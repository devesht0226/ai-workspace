# Render Blueprint — free-tier friendly (native Python, not Docker)
# https://render.com/docs/blueprint-spec
# Deploy: Render → New → Blueprint → this repo

services:
  - type: web
    name: ai-workspace-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_API_DOCS
        value: "true"
      - key: LLM_PROVIDER
        value: openai
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-workspace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://localhost
      - key: APP_BASE_URL
        value: https://localhost
      - key: API_PUBLIC_URL
        value: https://ai-workspace-api.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://([\w-]+\.)?vercel\.app

databases:
  - name: ai-workspace-db
    plan: free
