# Nginx with optional TLS (place certs in deploy/nginx/certs/)
# Generate: bash scripts/generate-tls.sh  (or use Git Bash / WSL on Windows)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 25m;

    upstream api_upstream { server api:8000; }
    upstream web_upstream { server web:3000; }

    # HTTP -> HTTPS redirect when certs exist; otherwise serve HTTP on 80
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location /api/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location /health { proxy_pass http://api_upstream/health; }
        location /ready { proxy_pass http://api_upstream/ready; }
        location /metrics { proxy_pass http://api_upstream/metrics; }
        location /docs { proxy_pass http://api_upstream/docs; }
        location /openapi.json { proxy_pass http://api_upstream/openapi.json; }

        location / {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
